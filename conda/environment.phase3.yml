name: justnews-py312-phase3
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12.11
  - pip
  - gcc_linux-64
  - gxx_linux-64
  
  # Scientific Stack (GPU-ready)
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.0
  - scikit-learn>=1.3
  - networkx>=3.0
  - numba

  # Database
  - mysql-connector-python>=9.0
  - sqlalchemy>=2.0
  - aiosqlite>=0.19

  # ML / AI (GPU-enabled)
  - spacy>=3.7
  
  # PyTorch (CUDA-enabled, required for vLLM)
  - pytorch::pytorch
  - pytorch::torchvision
  - pytorch::torchaudio
  - pytorch::pytorch-cuda=12.1

  # GPU Utilities
  - nvidia-ml-py

  # Web Frameworks
  - fastapi>=0.120
  - uvicorn
  - starlette
  - django>=4.2

  # Networking
  - requests>=2.31
  - httpx>=0.28
  - aiohttp>=3.9
  - aiofiles
  - uvloop
  - httptools
  - watchfiles

  # Utils
  - python-dotenv>=1.0
  - orjson
  - ujson
  - protobuf
  - thrift

  # Parsing
  - trafilatura
  - readability-lxml
  - justext
  - extruct
  - w3lib
  - langdetect
  - lxml
  - dateparser
  - beautifulsoup4
  - html5lib
  - cssselect
  - tld
  - lxml-html-clean

  # Opentelemetry
  - opentelemetry-api
  - opentelemetry-sdk
  - opentelemetry-instrumentation
  - opentelemetry-instrumentation-fastapi
  - opentelemetry-instrumentation-requests

  # Testing
  - pytest
  - pytest-asyncio
  - pytest-cov
  - coverage
  - mypy
  - ruff

  - pip:
    # LLM Inference (GPU-critical)
    - vllm==0.14.1
    - transformers<5.0.0
    - sentence-transformers>=5.0.0
    - tokenizers
    - accelerate
    - bitsandbytes
    - safetensors
    - sentencepiece>=0.2.1
    - peft>=0.11
    
    # Vector Store
    - chromadb>=0.4
    
    # ML/AI
    - datasets
    - qwen-vl-utils
    - litellm
    - tiktoken>=0.12
    - onnxruntime>=1.18
