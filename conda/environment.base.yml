name: justnews-py312-base
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12.11
  - pip
  - gcc_linux-64
  - gxx_linux-64
  
  # Scientific Stack (CPU)
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.0
  - scikit-learn>=1.3
  - networkx>=3.0
  - numba

  # Database
  - mysql-connector-python>=9.0
  - sqlalchemy>=2.0
  - aiosqlite>=0.19

  # Web Frameworks
  - fastapi>=0.120
  - uvicorn
  - starlette
  - django>=4.2

  # Networking
  - requests>=2.31
  - httpx>=0.28
  - aiohttp>=3.9
  - aiofiles
  - uvloop
  - httptools
  - watchfiles

  # Metrics & Monitoring
  - prometheus-client>=0.19

  # Authentication & Security
  - pyjwt>=2.8

  # Utils
  - python-dotenv>=1.0
  - orjson
  - ujson
  - protobuf
  - thrift

  # Parsing
  - trafilatura
  - readability-lxml
  - justext
  - extruct
  - w3lib
  - langdetect
  - lxml
  - dateparser
  - beautifulsoup4
  - html5lib
  - cssselect
  - tld
  - lxml-html-clean

  # Opentelemetry
  - opentelemetry-api
  - opentelemetry-sdk
  - opentelemetry-instrumentation
  - opentelemetry-instrumentation-fastapi
  - opentelemetry-instrumentation-requests

  # Testing
  - pytest
  - pytest-asyncio
  - pytest-cov
  - coverage
  - mypy
  - ruff

  - pip:
    - chromadb>=0.4
    - datasets
    - qwen-vl-utils
    - litellm
    - tiktoken>=0.12
    - tld
