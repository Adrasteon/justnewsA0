<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JustNews Analytics Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; color: #222; }
    h1 { margin-bottom: 8px; }
    .muted { color: #666; margin-bottom: 24px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .ok { color: #0a7a2a; font-weight: 600; }
    .fail { color: #b00020; font-weight: 600; }
    code { background: #f5f5f5; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>JustNews Analytics Dashboard</h1>
  <div class="muted">Service is running. Use API endpoints below for detailed metrics.</div>

  <div class="card">
    <div><strong>Health:</strong> <span id="health" class="muted">Checking...</span></div>
  </div>

  <div class="card">
    <strong>Useful endpoints</strong>
    <ul>
      <li><code>/health</code></li>
      <li><code>/api/health</code></li>
      <li><code>/api/realtime/1</code></li>
      <li><code>/api/report/24</code></li>
      <li><code>/docs</code></li>
    </ul>
  </div>

  <script>
    async function checkHealth() {
      const el = document.getElementById('health');
      try {
        const res = await fetch('/health');
        if (res.ok) {
          el.textContent = 'healthy';
          el.className = 'ok';
        } else {
          el.textContent = 'degraded';
          el.className = 'fail';
        }
      } catch {
        el.textContent = 'unreachable';
        el.className = 'fail';
      }
    }
    checkHealth();
  </script>
</body>
</html>
