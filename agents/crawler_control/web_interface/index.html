<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustNews Crawler Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #1e1e1e; color: #ffffff; }
        .navbar { background-color: #2d3748; }
        .card { background-color: #2d3748; border: 1px solid #4a5568; margin-bottom: 20px; }
        .card-header { background-color: #4a5568; color: #ffffff; }
        .card-body { color: #ffffff; }
        .form-control, .form-select { background-color: #2d3748; color: #ffffff; border: 1px solid #4a5568; }
        .form-control:focus, .form-select:focus { background-color: #2d3748; color: #ffffff; border-color: #63b3ed; }
        .form-label { color: #ffffff; }
        .form-check-label { color: #ffffff; }
        .btn-primary { background-color: #3182ce; border-color: #3182ce; }
        .btn-primary:hover { background-color: #2c5282; border-color: #2c5282; }
        .btn-secondary { background-color: #4a5568; border-color: #4a5568; }
        .btn-secondary:hover { background-color: #2d3748; border-color: #2d3748; }
        .tab-content { padding: 20px; }
        .metric-card { height: 300px; margin-bottom: 20px; }
        .crawl-form-card { margin-bottom: 20px; }
        .status-card { margin-bottom: 20px; position: relative; }
        .metric-box { padding: 12px; background: #1e1e1e; border-radius: 4px; border: 1px solid #4a5568; }
        #crawlStatus { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            padding: 4px;
            box-sizing: border-box;
        }
        #crawlStatus .card { 
            margin: 0;
            padding: 0;
            width: 100%;
            box-sizing: border-box;
            min-width: 0;
            flex-shrink: 1;
            overflow: hidden;
        }
        .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="rgba(99, 179, 237, 0.5)"><path d="M20 20H10v-2h8v-8h2v10z"/></svg>');
            cursor: nwse-resize;
            background-repeat: no-repeat;
            background-size: 100%;
        }
        .resize-handle:hover {
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="rgba(99, 179, 237, 1)"><path d="M20 20H10v-2h8v-8h2v10z"/></svg>');
        }
        #crawlStatusContainer {
            resize: both;
            overflow: auto;
            user-select: none;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">JustNews Crawler Dashboard</a>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <ul class="nav nav-tabs" id="dashboardTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="crawl-tab" data-bs-toggle="tab" data-bs-target="#crawl" type="button" role="tab">Crawl Control</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="metrics-tab" data-bs-toggle="tab" data-bs-target="#metrics" type="button" role="tab">Metrics Dashboards</button>
            </li>
        </ul>
        <div class="tab-content" id="dashboardTabsContent">
            <div class="tab-pane fade show active" id="crawl" role="tabpanel">
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="card crawl-form-card">
                            <div class="card-header">
                                <h5 class="card-title">Crawl Configuration</h5>
                            </div>
                            <div class="card-body">
                                <form id="crawlForm">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <label for="domains" class="form-label">Domains or Database Query</label>
                                            <input type="text" class="form-control" id="domains" placeholder="e.g., bbc.com, cnn.com or 'sources 10' or 'all'" value="sources 5">
                                            <div class="form-text" style="color: #a0aec0;">Use comma-separated domains, 'sources &lt;number&gt;' for database sources, or 'all' for all sources</div>
                                        </div>
                                        <div class="col-md-3">
                                            <label for="maxSites" class="form-label">Max Sites</label>
                                            <input type="number" class="form-control" id="maxSites" value="5" min="1" max="50">
                                        </div>
                                        <div class="col-md-3">
                                            <label for="maxArticlesPerSite" class="form-label">Max Articles per Site</label>
                                            <input type="number" class="form-control" id="maxArticlesPerSite" value="10" min="1" max="100">
                                        </div>
                                    </div>
                                    <div class="row mt-3">
                                        <div class="col-md-4">
                                            <label for="concurrentSites" class="form-label">Concurrent Sites</label>
                                            <input type="number" class="form-control" id="concurrentSites" value="3" min="1" max="10">
                                        </div>
                                        <div class="col-md-4">
                                            <label for="strategy" class="form-label">Crawl Type</label>
                                            <select class="form-select" id="strategy">
                                                <option value="auto">Auto (Recommended)</option>
                                                <option value="ai_enhanced">AI Enhanced</option>
                                                <option value="generic">Generic (Universal)</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label for="enableAI" class="form-label">Enable AI Analysis</label>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="enableAI" checked>
                                                <label class="form-check-label" for="enableAI">Apply AI analysis to articles</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row mt-3">
                                        <div class="col-md-6">
                                            <label for="timeout" class="form-label">Timeout (seconds)</label>
                                            <input type="number" class="form-control" id="timeout" value="300" min="30" max="3600">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="userAgent" class="form-label">User Agent</label>
                                            <input type="text" class="form-control" id="userAgent" value="JustNewsAgent/1.0">
                                        </div>
                                    </div>
                                    <button type="button" id="crawlButton" class="btn btn-primary mt-3">Start Crawl</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card status-card">
                            <div class="card-header" style="cursor: move;">
                                <h5 class="card-title mb-0">Crawl Status</h5>
                            </div>
                            <div id="crawlStatusContainer" class="card-body" style="height: 600px; overflow-y: auto; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; position: relative;">
                                <div id="crawlStatus" style="color: #a0aec0; font-size: 0.95rem;">Loading status...</div>
                                <div class="mt-3">
                                    <button id="refreshStatus" class="btn btn-secondary btn-sm me-2">Refresh</button>
                                    <button id="clearStatus" class="btn btn-outline-secondary btn-sm me-2">Clear Jobs</button>
                                    <button id="resetCrawler" class="btn btn-outline-danger btn-sm">Reset Crawler</button>
                                </div>
                                <div class="resize-handle" title="Drag to resize"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="tab-pane fade" id="metrics" role="tabpanel">
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="card metric-card">
                            <div class="card-header">
                                <h5 class="card-title">Crawler Performance</h5>
                            </div>
                            <div class="card-body">
                                <canvas id="crawlerChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card metric-card">
                            <div class="card-header">
                                <h5 class="card-title">Analyst Metrics</h5>
                            </div>
                            <div class="card-body">
                                <canvas id="analystChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="card metric-card">
                            <div class="card-header">
                                <h5 class="card-title">Memory Usage</h5>
                            </div>
                            <div class="card-body">
                                <canvas id="memoryChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card metric-card">
                            <div class="card-header">
                                <h5 class="card-title">System Health</h5>
                            </div>
                            <div class="card-body">
                                <div id="systemHealth">Loading...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let isCrawling = false;
        let crawlerChart, analystChart, memoryChart;
        let metricsRefreshInterval;
        let statusRefreshInterval;

        // Initialize button state
        function updateButtonState() {
            const button = document.getElementById('crawlButton');
            if (isCrawling) {
                button.textContent = 'Stop Crawl';
                button.className = 'btn btn-danger mt-3';
            } else {
                button.textContent = 'Start Crawl';
                button.className = 'btn btn-primary mt-3';
            }
        }

        // Make status container resizable
        function initializeResizable() {
            const container = document.getElementById('crawlStatusContainer');
            const resizeHandle = document.querySelector('.resize-handle');
            let isResizing = false;
            let startX = 0;
            let startY = 0;
            let startWidth = 0;
            let startHeight = 0;

            resizeHandle.addEventListener('mousedown', (e) => {
                isResizing = true;
                startX = e.clientX;
                startY = e.clientY;
                startWidth = container.offsetWidth;
                startHeight = container.offsetHeight;
                document.addEventListener('mousemove', handleResize);
                document.addEventListener('mouseup', stopResize);
            });

            function handleResize(e) {
                if (!isResizing) return;
                const newWidth = startWidth + (e.clientX - startX);
                const newHeight = startHeight + (e.clientY - startY);
                if (newWidth > 200) container.style.width = newWidth + 'px';
                if (newHeight > 200) container.style.height = newHeight + 'px';
            }

            function stopResize() {
                isResizing = false;
                document.removeEventListener('mousemove', handleResize);
                document.removeEventListener('mouseup', stopResize);
            }
        }

        // Make status card draggable
        function initializeDraggable() {
            const card = document.querySelector('.status-card');
            const header = card.querySelector('.card-header');
            let isDragging = false;
            let startX = 0;
            let startY = 0;
            let offsetX = 0;
            let offsetY = 0;

            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('h5')) {
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    offsetX = card.offsetLeft;
                    offsetY = card.offsetTop;
                    card.style.position = 'relative';
                    document.addEventListener('mousemove', handleDrag);
                    document.addEventListener('mouseup', stopDrag);
                }
            });

            function handleDrag(e) {
                if (!isDragging) return;
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;
                card.style.left = (offsetX + deltaX) + 'px';
                card.style.top = (offsetY + deltaY) + 'px';
                card.style.cursor = 'grabbing';
            }

            function stopDrag() {
                isDragging = false;
                document.removeEventListener('mousemove', handleDrag);
                document.removeEventListener('mouseup', stopDrag);
                card.style.cursor = 'default';
            }
        }

        // Format crawl status in a user-friendly way
        function formatCrawlStatus(data) {
            if (!data || Object.keys(data).length === 0) {
                return '<div class="alert alert-info">No active crawl jobs</div>';
            }

            let html = '';
            
            // Display each job
            Object.entries(data).forEach(([jobId, job]) => {
                const status = job.status || 'unknown';
                const result = job.result || {};
                
                // Status badge color
                let statusBadgeClass = 'bg-secondary';
                if (status === 'running' || status === 'pending') statusBadgeClass = 'bg-warning';
                if (status === 'completed') statusBadgeClass = 'bg-success';
                if (status === 'failed') statusBadgeClass = 'bg-danger';
                
                // Build job card
                html += `
                <div class="card" style="border-left: 4px solid #3182ce;">
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-8">
                                <h6 class="mb-1">Job ID: <code style="color: #63b3ed;">${jobId.substring(0, 12)}...</code></h6>
                                <span class="badge ${statusBadgeClass}">${status.toUpperCase()}</span>
                            </div>
                            <div class="col-md-4 text-end">
                                <small style="color: #a0aec0;">
                                    ${result.processing_time_seconds ? 
                                    `${result.processing_time_seconds.toFixed(1)}s` : 'Processing...'}
                                </small>
                            </div>
                        </div>
                        
                        <div class="row mt-3 mb-3">
                            <div class="col-md-6">
                                <div class="metric-box">
                                    <div style="color: #a0aec0; font-size: 0.85rem;">SITES CRAWLED</div>
                                    <div style="font-size: 1.5rem; font-weight: bold; color: #63b3ed;">
                                        ${result.sites_crawled || 0}
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="metric-box">
                                    <div style="color: #a0aec0; font-size: 0.85rem;">ARTICLES INGESTED</div>
                                    <div style="font-size: 1.5rem; font-weight: bold; color: #48bb78;">
                                        ${result.articles_ingested || 0}
                                    </div>
                                </div>
                            </div>
                        </div>`;
                
                // Show throughput
                if (result.articles_per_second) {
                    html += `<div style="color: #a0aec0; font-size: 0.9rem; margin-bottom: 10px;">
                        Throughput: <span style="color: #90cdf4;">${result.articles_per_second.toFixed(2)} articles/sec</span>
                    </div>`;
                }
                
                // Show issues if any
                if (result.ingestion_errors > 0 || result.duplicates_skipped > 0 || result.total_paywalls_detected > 0) {
                    html += `<div class="alert alert-warning py-2 mb-2" style="font-size: 0.9rem;">
                        ${result.ingestion_errors > 0 ? `<span class="badge bg-danger me-2">${result.ingestion_errors} errors</span>` : ''}
                        ${result.duplicates_skipped > 0 ? `<span class="badge bg-info me-2">${result.duplicates_skipped} duplicates</span>` : ''}
                        ${result.total_paywalls_detected > 0 ? `<span class="badge bg-secondary">${result.total_paywalls_detected} paywalls</span>` : ''}
                    </div>`;
                }
                
                // Show crawl settings that were used
                const lastSettings = localStorage.getItem('lastCrawlSettings');
                if (lastSettings) {
                    try {
                        const settings = JSON.parse(lastSettings);
                        html += `<div style="font-size: 0.85rem; color: #a0aec0; margin-top: 12px; padding: 8px; background: #1e1e1e; border-radius: 4px; border-left: 3px solid #63b3ed;">
                            <strong>Settings Used:</strong><br/>
                            • Domains: <span style="color: #90cdf4;">${settings.domains}</span><br/>
                            • Max Sites: <span style="color: #90cdf4;">${settings.max_sites}</span> | 
                            Articles/Site: <span style="color: #90cdf4;">${settings.max_articles_per_site}</span><br/>
                            • Concurrency: <span style="color: #90cdf4;">${settings.concurrent_sites}</span> | 
                            Strategy: <span style="color: #90cdf4;">${settings.strategy}</span>
                        </div>`;
                    } catch (e) {
                        // Silently fail if settings can't be parsed
                    }
                }
                
                // Show top performing sites
                if (result.site_breakdown && Object.keys(result.site_breakdown).length > 0) {
                    const siteEntries = Object.entries(result.site_breakdown)
                        .filter(([_, count]) => count > 0)
                        .sort((a, b) => b[1] - a[1])
                        .slice(0, 8);
                    
                    if (siteEntries.length > 0) {
                        html += `<div style="font-size: 0.9rem; color: #a0aec0; margin-top: 12px;">Top Sites:</div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;">`;
                        
                        siteEntries.forEach(([site, count]) => {
                            html += `<div style="background: #2d3748; padding: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;">
                                <span style="font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #63b3ed;">${site}</span>
                                <span style="font-weight: bold; color: #48bb78; margin-left: 8px;">${count}</span>
                            </div>`;
                        });
                        
                        html += `</div>`;
                    }
                }
                
                html += `</div>`;
            });
            
            return html;
        }

        // Check crawl status and update button (but don't override local state)
        function checkCrawlStatus() {
            fetch('/api/crawl/status')
            .then(response => response.json())
            .then(data => {
                // Only update isCrawling if there are active jobs returned
                const hasActiveJobs = Object.values(data).some(job => job.status === 'running' || job.status === 'pending');
                isCrawling = hasActiveJobs;
                updateButtonState();
                document.getElementById('crawlStatus').innerHTML = formatCrawlStatus(data);
                
                // Update form with last used settings if available
                const lastSettings = localStorage.getItem('lastCrawlSettings');
                if (lastSettings) {
                    try {
                        const settings = JSON.parse(lastSettings);
                        document.getElementById('domains').value = settings.domains || 'all';
                        document.getElementById('maxSites').value = settings.max_sites || 100;
                        document.getElementById('maxArticlesPerSite').value = settings.max_articles_per_site || 10;
                        document.getElementById('concurrentSites').value = settings.concurrent_sites || 3;
                        document.getElementById('strategy').value = settings.strategy || 'auto';
                        document.getElementById('enableAI').checked = settings.enable_ai !== false;
                        document.getElementById('timeout').value = settings.timeout || 600;
                        document.getElementById('userAgent').value = settings.user_agent || 'JustNews/1.0';
                    } catch (e) {
                        console.log('Failed to restore last settings:', e);
                    }
                }
            })
            .catch(() => {
                // If the request fails, show fallback message
                document.getElementById('crawlStatus').innerHTML = '<div class="alert alert-danger">Unable to fetch status</div>';
            });
        }

        // Initialize metrics charts
        function initializeCharts() {
            // Crawler Performance Chart
            const crawlerCtx = document.getElementById('crawlerChart').getContext('2d');
            crawlerChart = new Chart(crawlerCtx, {
                type: 'bar',
                data: {
                    labels: ['Articles', 'Sites', 'Per Second'],
                    datasets: [{
                        label: 'Crawler Metrics',
                        data: [0, 0, 0],
                        backgroundColor: ['#3182ce', '#63b3ed', '#90cdf4'],
                        borderColor: '#2c5282',
                        borderWidth: 1
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // Analyst Metrics Chart
            const analystCtx = document.getElementById('analystChart').getContext('2d');
            analystChart = new Chart(analystCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Sentiment', 'Bias', 'Topics'],
                    datasets: [{
                        data: [0, 0, 0],
                        backgroundColor: ['#38a169', '#f6ad55', '#fc8181'],
                        borderColor: '#2d3748',
                        borderWidth: 2
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // Memory Usage Chart
            const memoryCtx = document.getElementById('memoryChart').getContext('2d');
            memoryChart = new Chart(memoryCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Used', 'Free'],
                    datasets: [{
                        data: [0, 0],
                        backgroundColor: ['#ed8936', '#48bb78'],
                        borderColor: '#2d3748',
                        borderWidth: 2
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // Fetch and update metrics
        function updateMetrics() {
            // Fetch crawler metrics
            fetch('/api/metrics/crawler')
            .then(response => response.json())
            .then(data => {
                if (crawlerChart) {
                    crawlerChart.data.datasets[0].data = [
                        data.articles_processed || 0,
                        data.sites_crawled || 0,
                        (data.articles_per_second || 0).toFixed(2)
                    ];
                    crawlerChart.update();
                }
            })
            .catch(err => console.error('Crawler metrics error:', err));

            // Fetch analyst metrics
            fetch('/api/metrics/analyst')
            .then(response => response.json())
            .then(data => {
                if (analystChart) {
                    analystChart.data.datasets[0].data = [
                        data.sentiment_count || 0,
                        data.bias_count || 0,
                        data.topics_count || 0
                    ];
                    analystChart.update();
                }
            })
            .catch(err => console.error('Analyst metrics error:', err));

            // Fetch memory metrics
            fetch('/api/metrics/memory')
            .then(response => response.json())
            .then(data => {
                if (memoryChart) {
                    memoryChart.data.datasets[0].data = [
                        data.used || 0,
                        data.free || 0
                    ];
                    memoryChart.update();
                }
            })
            .catch(err => console.error('Memory metrics error:', err));

            // Fetch system health
            fetch('/api/health')
            .then(response => response.json())
            .then(data => {
                const healthHtml = Object.entries(data).map(([agent, status]) => {
                    const statusBadge = status ? '<span class="badge bg-success">OK</span>' : '<span class="badge bg-danger">DOWN</span>';
                    return `<div>${agent}: ${statusBadge}</div>`;
                }).join('');
                document.getElementById('systemHealth').innerHTML = healthHtml || 'No health data';
            })
            .catch(err => console.error('Health check error:', err));
        }

        // Start metrics refresh when metrics tab is shown
        document.getElementById('metrics-tab')?.addEventListener('shown.bs.tab', function() {
            updateMetrics();
            metricsRefreshInterval = setInterval(updateMetrics, 5000); // Refresh every 5 seconds
        });

        document.getElementById('metrics-tab')?.addEventListener('hidden.bs.tab', function() {
            clearInterval(metricsRefreshInterval);
        });

        document.addEventListener('DOMContentLoaded', function() {
            initializeCharts();
            initializeResizable();
            initializeDraggable();
            
            // Auto-refresh crawl status every 3 seconds
            statusRefreshInterval = setInterval(checkCrawlStatus, 3000);
            
            // Initial status check
            checkCrawlStatus();
            document.getElementById('crawlButton').addEventListener('click', function() {
                // If currently crawling, call stop; otherwise, start
                if (isCrawling) {
                    fetch('/api/crawl/stop', { method: 'POST' })
                    .then(r => r.json()).then(res => { isCrawling = false; updateButtonState(); checkCrawlStatus(); });
                    return;
                }

                const domains = document.getElementById('domains').value;
                const payload = {
                    domains: domains,
                    max_sites: parseInt(document.getElementById('maxSites').value, 10),
                    max_articles_per_site: parseInt(document.getElementById('maxArticlesPerSite').value, 10),
                    concurrent_sites: parseInt(document.getElementById('concurrentSites').value, 10),
                    strategy: document.getElementById('strategy').value,
                    enable_ai: document.getElementById('enableAI').checked,
                    timeout: parseInt(document.getElementById('timeout').value, 10),
                    user_agent: document.getElementById('userAgent').value
                };

                // Save settings to localStorage for later reference
                localStorage.setItem('lastCrawlSettings', JSON.stringify(payload));

                fetch('/api/crawl/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(response => response.json())
                .then(data => {
                    isCrawling = true;
                    updateButtonState();
                    const jobId = data.job_id || 'unknown';
                    document.getElementById('crawlStatus').innerHTML = `
                        <div class="card mb-3" style="border-left: 4px solid #48bb78;">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-8">
                                        <h6 class="mb-1">Job ID: <code style="color: #63b3ed;">${jobId.substring(0, 12)}...</code></h6>
                                        <span class="badge bg-warning">STARTING</span>
                                    </div>
                                    <div class="col-md-4 text-end">
                                        <small style="color: #a0aec0;">Status: ${data.status || 'pending'}</small>
                                    </div>
                                </div>
                                <p class="mt-3 mb-0" style="color: #90cdf4;">✓ Crawl job accepted and queued for processing...</p>
                            </div>
                        </div>
                    `;
                })
                .catch(err => {
                    document.getElementById('crawlStatus').innerHTML = `<div class="alert alert-danger">Failed to start crawl: ${err}</div>`;
                });
            });

            document.getElementById('refreshStatus').addEventListener('click', checkCrawlStatus);
            document.getElementById('clearStatus').addEventListener('click', function() { fetch('/api/crawl/clear_jobs', { method: 'POST' }).then(r => r.json()).then(() => checkCrawlStatus()); });
            document.getElementById('resetCrawler').addEventListener('click', function() { fetch('/api/crawl/reset', { method: 'POST' }).then(r => r.json()).then(() => checkCrawlStatus()); });

            checkCrawlStatus();
        });
    </script>
</body>
</html>
