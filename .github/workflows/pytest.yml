name: CI — PyTest

on:
  push:
  pull_request:

jobs:
  check-global-env:
    name: Validate global.env (PYTHON_BIN present)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run global.env validation
        env:
          CI: true
        run: |
          bash infrastructure/scripts/validate-global-env.sh

      - name: Check canonical UV env usage
        env:
          CI: true
        run: |
          bash scripts/dev/check_canonical_env.sh

  processing_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-bootstrap.txt
      - name: Preflight checks - protobuf & deprecation
        env:
          PYTHON_BIN: python
          CI: true
        run: |
          python scripts/check_protobuf_version.py
          python scripts/check_deprecation_warnings.py
      - name: Processing time sanity check
        run: |
          make check-processing-time

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-bootstrap.txt
      - name: Run lint (ruff + mypy)
        run: |
          make lint

  pytest:
    needs: [processing_check, lint, check-global-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-bootstrap.txt
      - name: Run retired-root stub guard (hard-block)
        run: |
          pytest -q tests/test_retired_root_stubs.py

      - name: Run tests
        run: |
          pytest -q

  monitoring:
    name: Monitoring checks
    needs: [processing_check, check-global-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-bootstrap.txt
      - name: Run monitoring tests
        run: |
          pytest -q tests/monitoring

  integration_smoke:
    name: "Integration smoke: synthesize -> publish -> public API (mocked)"
    needs: [processing_check, lint, check-global-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-bootstrap.txt
      - name: Run integration smoke test
        run: |
          pytest -q tests/integration/test_full_pipeline_5_variations.py::test_full_pipeline_5_variations
