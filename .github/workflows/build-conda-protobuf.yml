name: build-legacy-protobuf-wheel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build protobuf wheel (legacy compatibility)
        run: |
          python -m pip install --upgrade pip build setuptools wheel
          python -m build conda/recipes/protobuf || true

      - name: Show built artifacts
        run: |
          find conda/recipes/protobuf -maxdepth 3 -type f | sort

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: protobuf-legacy-build
          path: conda/recipes/protobuf
