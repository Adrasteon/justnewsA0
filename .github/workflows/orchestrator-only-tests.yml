name: CI — Orchestrator-only tests

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'agents/gpu_orchestrator/**'
      - 'tests/unit/test_gpu_orchestrator_*'
      - 'tests/integration/test_claim_concurrency.py'

jobs:
  orchestrator_tests:
    name: "Orchestrator: unit + integration (targeted)"
    runs-on: ubuntu-latest
    env:
      BNB_CUDA_VERSION: 122
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-bootstrap.txt

      - name: Attempt to fetch latest bitsandbytes wheel from GitHub Actions artifacts
        run: |
          set -euo pipefail
          echo "Searching GH actions artifacts for bitsandbytes-wheel-${BNB_CUDA_VERSION}..."
          if command -v jq >/dev/null 2>&1; then
            runs_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/.github/workflows/build-bnb-wheels.yml/runs?status=success&per_page=20"
            artifact_url=""
            runs_json=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$runs_url") || runs_json=""
            if [ -z "$runs_json" ]; then
              echo "no runs json returned" && exit 0
            fi
            for run_id in $(echo "$runs_json" | jq -r '.workflow_runs[].id' || true); do
              arti_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts"
              arti_json=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$arti_url" || true)
              candidate=$(echo "$arti_json" | jq -r '.artifacts[] | select(.name==("bitsandbytes-wheel-'${BNB_CUDA_VERSION}'")) | .archive_download_url' || true)
              if [ -n "$candidate" ] && [ "$candidate" != "null" ]; then
                artifact_url=$candidate
                break
              fi
            done

            if [ -n "$artifact_url" ]; then
              echo "Found artifact: $artifact_url"
              mkdir -p wheel-cache
              curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o wheel-cache/bnb-artifact.zip "$artifact_url"
              unzip -q wheel-cache/bnb-artifact.zip -d wheel-cache || true
              if ls -1 wheel-cache/*.whl >/dev/null 2>&1; then
                python -m pip install --no-deps --upgrade wheel-cache/*.whl || true
              else
                echo "No whl file found inside artifact"
              fi
            else
              echo "No GH Actions artifact found for bitsandbytes-wheel-${BNB_CUDA_VERSION}"
            fi
          else
            echo "jq not available; skipping GH artifact fetch"
          fi

      - name: Run orchestrator tests
        run: |
          pytest -q tests/unit/test_gpu_orchestrator_* -q
          pytest -q tests/integration/test_claim_concurrency.py -q || true
