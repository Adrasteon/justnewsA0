version: "3.8"
services:
  app:
    container_name: app
    build: .
    volumes:
      - ..:/app:cached
      - justnews_deps:/deps
      - justnews_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    gpus: all
    user: root
    depends_on:
      mariadb:
        condition: service_started
      chromadb:
        condition: service_started
    # vLLM is intentionally NOT a hard dependency
    # The app can start without vLLM; vLLM will be accessed on-demand with retries
    environment:
      - VLLM_OPTIONAL=true
      - VLLM_CONNECT_TIMEOUT=30
      - VLLM_RETRY_ATTEMPTS=5
    command: sleep infinity
    restart: unless-stopped
    labels:
      service: "app"
      component: "web-application"
      tier: "critical"
      owner: "infrastructure"
      gpu_required: "false"
      memory_required: "2GB"
      healthcheck: "manual: curl http://localhost:8000/health after starting the app server inside the devcontainer"
      restart_policy: "unless-stopped"
      dependencies: "mariadb,chromadb"
      optional_dependencies: "vllm"

  fact-checker:
    container_name: fact-checker
    build:
      context: ../mcp_fact_checker_server
    environment:
      - FACT_CHECKER_API_KEY=dev_key_123
      - VLLM_BASE_URL=http://vllm:8010/v1
      - VLLM_FACT_CHECKER_MODEL=Qwen/Qwen2.5-14B-Instruct-AWQ
      - VLLM_OPTIONAL=true
      - VLLM_CONNECT_TIMEOUT=60
      - VLLM_RETRY_ATTEMPTS=10
      - MODEL_STORE_ROOT=/app/model_store
      - MODEL_STORE_EMBEDDING_AGENT=fact_checker
      - STRICT_MODEL_STORE=1
      - LOG_LEVEL=INFO
      - FACT_CHECKER_AGENT_PORT=8003
      - PYTHONPATH=/app:/app/fact_checker_lib
    volumes:
      - ../mcp_fact_checker_server:/app
      - ../database:/app/database
      - ../common:/app/common
      - ../global.env:/app/global.env
      - ../config:/app/config
      - ../model_store:/app/model_store
      - justnews_deps:/deps
    ports:
      - "8003:8000"
    restart: unless-stopped
    depends_on:
      # Removed vllm health check dependency
      # fact-checker will handle vLLM unavailability gracefully
      app:
        condition: service_started
    labels:
      service: "fact-checker"
      component: "agent"
      owner: "backend"
      optional_dependencies: "vllm"

  mariadb:
    container_name: mariadb
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-dev_root_password}
      MYSQL_USER: ${MARIADB_USER:-justnews}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:-dev_justnews_password}
      MYSQL_DATABASE: ${MARIADB_DB:-justnews}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    labels:
      service: "mariadb"
      component: "database"
      tier: "critical"
      owner: "dba"
      gpu_required: "false"
      memory_required: "1GB"
      disk_required: "10GB"
      healthcheck: "mysql -u root -p$MYSQL_ROOT_PASSWORD -e 'SELECT 1'"
      restart_policy: "always"
      backup_required: "true"
      backup_interval: "daily"
      max_connections: "100"

  chromadb:
    container_name: chromadb
    image: chromadb/chroma:latest
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - chromadb_data:/chroma/data
    ports:
      - "3307:8000"
    labels:
      service: "chromadb"
      component: "vector-database"
      tier: "critical"
      owner: "ml-ops"
      gpu_required: "false"
      memory_required: "4GB"
      restart_policy: "always"
      api_version: "latest"
      monitor_collections: "true"
      alert_on_disconnected: "true"
      persistence: "true"
      backup_required: "true"

  vllm:
    container_name: vllm
    image: vllm/vllm-openai:latest
    gpus: all
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command: --model Qwen/Qwen2.5-14B-Instruct-AWQ --port 8010
    ports:
      - "8010:8010"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    labels:
      service: "vllm"
      component: "llm-inference"
      tier: "critical"
      owner: "ml-ops"
      gpu_required: "true"
      gpu_memory_required: "24GB"
      host_memory_required: "8GB"
      model: "Qwen/Qwen2.5-14B-Instruct-AWQ"
      model_size: "14B"
      model_quantization: "AWQ"
      model_download_size: "14GB"
      model_load_time_seconds: "300"
      healthcheck: "curl -f http://localhost:8010/v1/models"
      restart_policy: "unless-stopped"
      startup_timeout_seconds: "600"
      alert_on_slow_inference: "true"
      max_concurrent_requests: "5"

volumes:
  justnews_deps:
    driver: local
  justnews_data:
    driver: local
  mariadb_data:
    driver: local
  chromadb_data:
    driver: local
  huggingface_cache:
    driver: local
