name: justnews-py312
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12.11
  - pip
  - mamba
  - gcc_linux-64
  - gxx_linux-64
  
  # Scientific Stack
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.0
  - scikit-learn>=1.3
  - networkx>=3.0
  - numba

  # Database
  - mysql-connector-python>=9.0
  - sqlalchemy>=2.0
  - aiosqlite>=0.19

  # ML / AI
  - spacy>=3.7
  
  # PyTorch
  - pytorch
  - torchvision
  - torchaudio
  - nvidia-ml-py

  # Web Frameworks
  - fastapi>=0.120
  - uvicorn
  - starlette
  - django>=4.2

  # Networking
  - requests>=2.31
  - httpx>=0.28
  - aiohttp>=3.9
  - aiofiles
  - uvloop
  - httptools
  - watchfiles

  # Enterprise Research Stack (Recommended)
  - duckduckgo-search>=5.0  # Privacy-friendly search
  # - faster-whisper>=0.10  # Traceable audio transcription (Uncomment to enable AV)

  # Browser Automation
  - playwright

  # Utils
  - python-dotenv>=1.0
  - orjson
  - ujson
  # Note: protobuf requires custom build for Python 3.12 (see conda/README.md)
  # Do not rely on conda-forge protobuf 4.x/5.x mismatch
  - protobuf
  - thrift

  # Parsing
  - trafilatura
  - readability-lxml
  - justext
  - extruct
  - w3lib
  - langdetect
  - lxml
  - dateparser
  - beautifulsoup4
  - html5lib
  - cssselect
  - tld
  - lxml-html-clean

  # Opentelemetry
  - opentelemetry-api
  - opentelemetry-sdk
  - opentelemetry-instrumentation
  - opentelemetry-instrumentation-fastapi
  - opentelemetry-instrumentation-requests

  # Testing
  - pytest
  - pytest-asyncio
  - pytest-cov
  - coverage
  - mypy
  - ruff

  - pip:
    - datasets
    - chromadb>=0.4
    - crawl4ai==0.8.0
    - litellm
    - patchright
    - tf-playwright-stealth
    - vllm==0.14.1
    # Specific versions for compatibility
    - transformers<5.0.0
    - sentence-transformers>=5.0.0
    - tokenizers
    - accelerate
    - bitsandbytes
    - safetensors
    - sentencepiece>=0.2.1
    # Note: peft required for adapters
    - peft>=0.11
    - tiktoken>=0.12
    - onnxruntime>=1.18
